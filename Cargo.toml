[workspace]
resolver = "2"
members = ["programs/*", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
pinocchio = "=0.11.2"
pinocchio-system = "=0.6.1"
pinocchio-token = "=0.6.0"
solana-address = { version = "=2.7.0", features = ["decode"] }
shank = "=0.4.9"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
